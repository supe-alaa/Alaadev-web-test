<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="sidebar.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlaaDev Hub - تواصل معنا</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f4f8fc;
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1rem 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }

        .blue-fog {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }
        .fog-top-right {
            background: rgba(59, 130, 246, 0.22);
            width: 450px;
            height: 450px;
            top: -120px;
            right: -120px;
        }
        .fog-bottom-left {
            background: rgba(96, 165, 250, 0.18);
            width: 400px;
            height: 400px;
            bottom: -120px;
            left: -120px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 25px 50px -12px rgba(30, 64, 175, 0.12);
            width: 100%;
            max-width: 28rem;
            border-radius: 2.5rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin: auto;
        }

        @media (min-width: 640px) {
            .glass-card {
                max-width: 32rem;
                padding: 2.5rem;
            }
        }

        @media (min-width: 768px) {
            .glass-card {
                padding: 3rem;
            }
        }

        .logo-box {
            width: 6rem;
            height: 6rem;
            border-radius: 1.6rem;
            background: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            border: 2px solid rgba(191, 219, 254, 0.8);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 100ms forwards;
            opacity: 0;
        }

        @media (min-width: 640px) {
            .logo-box {
                width: 7rem;
                height: 7rem;
                margin-bottom: 2rem;
            }
        }

        .logo-box .glow-bg {
            position: absolute;
            inset: 0;
            border-radius: 1.6rem;
            background: rgba(96, 165, 250, 0.2);
            filter: blur(8px);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 1.4rem;
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .logo-box:hover img {
            transform: scale(1.05);
        }

        .main-title {
            font-size: 1.875rem;
            font-weight: 900;
            margin-bottom: 0.25rem;
            letter-spacing: -0.025em;
            text-shadow: 0 4px 20px rgba(37, 99, 235, 0.25);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 200ms forwards;
            opacity: 0;
        }

        @media (min-width: 640px) {
            .main-title {
                font-size: 2.25rem;
            }
        }

        .color-blue {
            color: #2563eb;
        }

        .hub-text {
            color: #ffffff;
            -webkit-text-stroke: 1.5px #000000;
            text-stroke: 1.5px #000000;
            paint-order: stroke fill;
        }

        .subtitle {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(59, 130, 246, 0.8);
            margin-bottom: 0.75rem;
            display: block;
            letter-spacing: 0.05em;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 220ms forwards;
            opacity: 0;
        }

        @media (min-width: 640px) {
            .subtitle {
                font-size: 0.875rem;
            }
        }

        .main-desc {
            font-size: 0.875rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 1.5rem;
            min-height: 3rem;
            line-height: 1.6;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 250ms forwards;
            opacity: 0;
        }

        @media (min-width: 640px) {
            .main-desc {
                font-size: 1rem;
            }
        }

        .typing-cursor::after {
            content: '|';
            animation: blink 0.8s infinite;
            color: #3b82f6;
            font-weight: bold;
            margin-right: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
            width: 100%;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 300ms forwards;
            opacity: 0;
        }

        .contact-card {
            background: rgba(239, 246, 255, 0.75);
            border: 1px solid rgba(191, 219, 254, 0.8);
            padding: 0.875rem 1rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .contact-card:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15);
            border-color: #93c5fd;
        }

        .contact-info {
            display: flex;
            align-items: center;
            gap: 0.875rem;
        }

        .icon-box {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
        }

        .text-details {
            text-align: right;
        }

        .text-details .label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 0.125rem;
        }

        .text-details .value {
            font-size: 0.875rem;
            font-weight: 700;
            color: #334155;
        }

        @media (min-width: 640px) {
            .text-details .value {
                font-size: 1rem;
            }
        }

        .arrow-icon {
            color: #94a3b8;
            transition: color 0.2s ease;
        }

        .contact-card:hover .arrow-icon {
            color: #2563eb;
        }

        /* ألوان الأيقونات لكل منصة */
        .bg-email { background-color: #dbeafe; color: #2563eb; }
        .bg-youtube { background-color: #fee2e2; color: #FF0000; }
        .bg-tiktok { background-color: #f1f5f9; color: #010101; }
        .bg-instagram { background-color: #fce7f3; color: #E1306C; }
        .bg-facebook { background-color: #dbeafe; color: #1877F2; }

        .copy-btn {
            background-color: #2563eb;
            color: #ffffff;
            padding: 0.5rem 0.875rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .copy-btn:hover {
            background-color: #1d4ed8;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            right: 0;
            height: 4px;
            background: #3b82f6;
            width: 0%;
            transition: width linear;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #3b82f6;
            border-radius: 50%;
            pointer-events: none;
            animation: explode 0.6s ease-out forwards;
            z-index: 20;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="blue-fog fog-top-right"></div>
    <div class="blue-fog fog-bottom-left"></div>

    <main class="glass-card">
        
        <div class="logo-box">
            <div class="glow-bg"></div>
            <img src="1.png" alt="AlaaDev Logo">
        </div>

        <h1 class="main-title">
            <span class="color-blue">AlaaDev</span> 
            <span class="hub-text">Hub</span>
        </h1>
        
        <span class="subtitle">تواصل معنا</span>

        <p id="contact-desc" class="main-desc typing-cursor"></p>

        <div class="contact-list">
            
            <div class="contact-card">
                <div class="contact-info">
                    <div class="icon-box bg-email">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div class="text-details">
                        <span class="label">البريد الإلكتروني</span>
                        <span id="email-text" class="value" dir="ltr">alaacoder128@gmail.com</span>
                    </div>
                </div>
                <button id="copy-btn" onclick="copyEmail(event)" class="copy-btn">
                    <i id="copy-icon" class="fa-regular fa-copy"></i>
                    <span id="copy-text">نسخ</span>
                </button>
            </div>

            <a href="https://youtube.com/@alaa-dev" target="_blank" onclick="handleRedirect(event, this.href)" class="contact-card">
                <div class="contact-info">
                    <div class="icon-box bg-youtube">
                        <i class="fa-brands fa-youtube"></i>
                    </div>
                    <div class="text-details">
                        <span class="label">يوتيوب</span>
                        <span class="value">@alaa-dev</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-left arrow-icon"></i>
                <div class="progress-bar"></div>
            </a>

            <a href="https://tiktok.com/@alaadev.official" target="_blank" onclick="handleRedirect(event, this.href)" class="contact-card">
                <div class="contact-info">
                    <div class="icon-box bg-tiktok">
                        <i class="fa-brands fa-tiktok"></i>
                    </div>
                    <div class="text-details">
                        <span class="label">تيك توك</span>
                        <span class="value">@alaadev.official</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-left arrow-icon"></i>
                <div class="progress-bar"></div>
            </a>

            <a href="https://www.instagram.com/alaadev_official/" target="_blank" onclick="handleRedirect(event, this.href)" class="contact-card">
                <div class="contact-info">
                    <div class="icon-box bg-instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <div class="text-details">
                        <span class="label">إنستغرام</span>
                        <span class="value">alaadev_official</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-left arrow-icon"></i>
                <div class="progress-bar"></div>
            </a>

            <a href="https://www.facebook.com/profile.php?id=61563114661369" target="_blank" onclick="handleRedirect(event, this.href)" class="contact-card">
                <div class="contact-info">
                    <div class="icon-box bg-facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </div>
                    <div class="text-details">
                        <span class="label">فيسبوك</span>
                        <span class="value">صفحة المطور</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-left arrow-icon"></i>
                <div class="progress-bar"></div>
            </a>

        </div>
    </main>

    <script>
        const textToType = "يسعدني سماع أفكارك أو الإجابة على استفساراتك عبر القنوات التالية.";
        let charIndex = 0;
        const speed = 40;

        function typeWriter() {
            if (charIndex < textToType.length) {
                document.getElementById("contact-desc").textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, speed);
            }
        }

        window.addEventListener('load', () => {
            setTimeout(typeWriter, 500);
        });

        function copyEmail(event) {
            const emailText = document.getElementById('email-text').innerText;
            const copyText = document.getElementById('copy-text');
            const copyIcon = document.getElementById('copy-icon');
            const btn = document.getElementById('copy-btn');

            navigator.clipboard.writeText(emailText).then(() => {
                copyText.innerText = "تم النسخ!";
                copyIcon.className = "fa-solid fa-check";
                
                const rect = btn.getBoundingClientRect();
                createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);

                setTimeout(() => {
                    copyText.innerText = "نسخ";
                    copyIcon.className = "fa-regular fa-copy";
                }, 2000);
            });
        }

        function createExplosion(x, y) {
            const particlesCount = 14;
            for (let i = 0; i < particlesCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 60 + 20;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 600);
            }
        }

        function handleRedirect(event, url) {
            event.preventDefault();
            const card = event.currentTarget;
            const progressBar = card.querySelector('.progress-bar');

            progressBar.style.transitionDuration = '600ms';
            progressBar.style.width = '100%';

            setTimeout(() => {
                window.location.href = url;
            }, 650);
        }
    </script>

</body>
</html>
