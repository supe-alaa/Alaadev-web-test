<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="sidebar.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlaaDev - سيرفر ديسكورد</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f4f8fc;
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1rem 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }

        .blue-fog {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }
        .fog-top-right {
            background: rgba(88, 101, 242, 0.22);
            width: 450px;
            height: 450px;
            top: -120px;
            right: -120px;
        }
        .fog-bottom-left {
            background: rgba(59, 130, 246, 0.18);
            width: 400px;
            height: 400px;
            bottom: -120px;
            left: -120px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 25px 50px -12px rgba(30, 64, 175, 0.12);
            width: 100%;
            max-width: 28rem;
            border-radius: 2.5rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin: auto;
        }

        @media (min-width: 640px) {
            .glass-card {
                max-width: 32rem;
                padding: 2.5rem;
            }
        }

        @media (min-width: 768px) {
            .glass-card {
                padding: 3rem;
            }
        }

        .logo-box {
            width: 6rem;
            height: 6rem;
            border-radius: 1.6rem;
            background: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            border: 2px solid rgba(199, 210, 254, 0.8);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 100ms forwards;
            opacity: 0;
        }

        @media (min-width: 640px) {
            .logo-box {
                width: 7rem;
                height: 7rem;
                margin-bottom: 2rem;
            }
        }

        .logo-box .glow-bg {
            position: absolute;
            inset: 0;
            border-radius: 1.6rem;
            background: rgba(129, 140, 248, 0.2);
            filter: blur(8px);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 1.4rem;
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .logo-box:hover img {
            transform: scale(1.05);
        }

        .main-title {
            font-size: 1.875rem;
            font-weight: 900;
            margin-bottom: 0.25rem;
            letter-spacing: -0.025em;
            text-shadow: 0 4px 20px rgba(88, 101, 242, 0.25);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 200ms forwards;
            opacity: 0;
        }

        @media (min-width: 640px) {
            .main-title {
                font-size: 2.25rem;
            }
        }

        .color-discord {
            color: #5865F2;
        }

        .hub-text {
            color: #ffffff;
            -webkit-text-stroke: 1.5px #000000;
            text-stroke: 1.5px #000000;
            paint-order: stroke fill;
        }

        .subtitle {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(99, 102, 241, 0.8);
            margin-bottom: 0.75rem;
            display: block;
            letter-spacing: 0.05em;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 220ms forwards;
            opacity: 0;
        }

        @media (min-width: 640px) {
            .subtitle {
                font-size: 0.875rem;
            }
        }

        .main-desc {
            font-size: 0.875rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 2rem;
            min-height: 3rem;
            line-height: 1.6;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 250ms forwards;
            opacity: 0;
        }

        @media (min-width: 640px) {
            .main-desc {
                font-size: 1rem;
            }
        }

        .typing-cursor::after {
            content: '|';
            animation: blink 0.8s infinite;
            color: #5865F2;
            font-weight: bold;
            margin-right: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
            width: 100%;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 300ms forwards;
            opacity: 0;
        }

        .btn-discord {
            position: relative;
            overflow: hidden;
            background-color: #5865F2;
            color: #ffffff;
            padding: 1rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(88, 101, 242, 0.25);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-discord:hover {
            background-color: #4752C4;
            transform: translateY(-2px);
        }

        .btn-discord:active {
            transform: scale(0.95);
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            right: 0;
            height: 4px;
            background: #ffffff;
            width: 0%;
            transition: width linear;
        }

        .btn-home {
            width: 100%;
            background-color: #f1f5f9;
            color: #334155;
            padding: 0.875rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-home:hover {
            background-color: #e2e8f0;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="blue-fog fog-top-right"></div>
    <div class="blue-fog fog-bottom-left"></div>

    <main class="glass-card">
        
        <div class="logo-box">
            <div class="glow-bg"></div>
            <img src="1.png" alt="AlaaDev Logo">
        </div>

        <h1 class="main-title">
            <span class="color-discord">AlaaDev</span> 
            <span class="hub-text">Discord</span>
        </h1>
        
        <span class="subtitle">مجتمع المطورين والمصممين</span>

        <p id="contact-desc" class="main-desc typing-cursor"></p>

        <div class="buttons-container">
            <a href="https://discord.gg/vBSkUcsCX" target="_blank" onclick="handleRedirect(event, this.href)" class="btn-discord">
                <i class="fa-brands fa-discord" style="font-size: 1.5rem;"></i>
                <span style="font-size: 1rem; font-weight: 700;">الانضمام إلى سيرفر ديسكورد</span>
                <div class="progress-bar"></div>
            </a>

            <a href="index.html" class="btn-home">
                <i class="fa-solid fa-house"></i>
                <span>العودة للصفحة الرئيسية</span>
            </a>
        </div>
    </main>

    <script>
        const textToType = "انضم إلينا في مجتمع ديسكورد لتشارك أفكارك، تطور مشاريعك، وتتواصل مع المطورين الآخرين.";
        let charIndex = 0;
        const speed = 40;

        function typeWriter() {
            if (charIndex < textToType.length) {
                document.getElementById("contact-desc").textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, speed);
            }
        }

        window.addEventListener('load', () => {
            setTimeout(typeWriter, 500);
        });

        function handleRedirect(event, url) {
            event.preventDefault();
            const card = event.currentTarget;
            const progressBar = card.querySelector('.progress-bar');

            progressBar.style.transitionDuration = '600ms';
            progressBar.style.width = '100%';

            setTimeout(() => {
                window.location.href = url;
            }, 650);
        }
    </script>

</body>
</html>
