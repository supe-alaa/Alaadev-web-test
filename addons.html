<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlaaDev - الإضافات</title>
    
    <!-- خط تجوال -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* إعدادات عامة */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f8fc;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            font-family: 'Tajawal', sans-serif;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        @media (min-width: 640px) {
            body {
                padding: 2rem;
            }
        }

        /* تأثيرات الضباب الخلفي */
        .blue-fog {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }
        .fog-top-right {
            background: rgba(59, 130, 246, 0.22);
            width: 450px;
            height: 450px;
            top: -120px;
            right: -120px;
        }
        .fog-bottom-left {
            background: rgba(96, 165, 250, 0.18);
            width: 400px;
            height: 400px;
            bottom: -120px;
            left: -120px;
        }

        /* بطاقة الزجاج (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 25px 50px -12px rgba(30, 64, 175, 0.12);
            width: 100%;
            max-width: 28rem;
            border-radius: 2.5rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin: auto;
        }

        @media (min-width: 640px) {
            .glass-card {
                max-width: 32rem;
                padding: 2.5rem;
            }
        }

        @media (min-width: 768px) {
            .glass-card {
                padding: 3rem;
            }
        }

        /* أيقونة القسم */
        .icon-box {
            width: 6rem;
            height: 6rem;
            border-radius: 1.6rem;
            background-color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            border: 1px solid #ffffff;
            position: relative;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 100ms;
            opacity: 0;
        }

        @media (min-width: 640px) {
            .icon-box {
                width: 7rem;
                height: 7rem;
                margin-bottom: 2rem;
            }
        }

        .icon-glow {
            position: absolute;
            inset: 0;
            border-radius: 1.6rem;
            background: rgba(96, 165, 250, 0.2);
            filter: blur(8px);
        }

        .section-icon {
            font-size: 2.25rem;
            color: #2563eb;
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        @media (min-width: 640px) {
            .section-icon {
                font-size: 3rem;
            }
        }

        .icon-box:hover .section-icon {
            transform: scale(1.1);
        }

        /* العناوين والنصوص */
        .main-title {
            font-size: 1.875rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
            text-shadow: 0 4px 20px rgba(37, 99, 235, 0.25);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 200ms;
            opacity: 0;
        }

        @media (min-width: 640px) {
            .main-title {
                font-size: 2.25rem;
            }
        }

        .text-blue {
            color: #2563eb;
        }

        .hub-text {
            color: #ffffff;
            -webkit-text-stroke: 1.5px #000000;
            text-stroke: 1.5px #000000;
            paint-order: stroke fill;
        }

        .subtitle {
            font-size: 0.75srem;
            font-weight: 700;
            color: rgba(59, 130, 246, 0.8);
            margin-bottom: 1.5rem;
            display: block;
            letter-spacing: 0.025em;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 200ms;
            opacity: 0;
        }

        @media (min-width: 640px) {
            .subtitle {
                font-size: 0.875rem;
            }
        }

        /* قائمة البطاقات */
        .addons-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 300ms;
            opacity: 0;
        }

        /* بطاقة الإضافة الفردية */
        .addon-card {
            background: rgba(239, 246, 255, 0.75);
            border: 1px solid rgba(191, 219, 254, 0.8);
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            position: relative;
        }

        .addon-card:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.12);
        }

        .addon-info {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            text-align: right;
        }

        /* أيقونة العنصر (ماين كرافت / يوتيوب) */
        .item-icon {
            width: 3rem;
            height: 3rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .emerald-box {
            background-color: #d1fae5;
            color: #059669;
        }

        .red-box {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .item-category {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
        }

        .item-title {
            font-size: 0.875rem;
            font-weight: 700;
            color: #334155;
        }

        @media (min-width: 640px) {
            .item-title {
                font-size: 1rem;
            }
        }

        /* زر التحميل */
        .download-btn {
            background-color: #2563eb;
            color: #ffffff;
            padding: 0.625rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 0.375rem;
            flex-shrink: 0;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        @media (min-width: 640px) {
            .download-btn {
                padding: 0.625rem 1.25rem;
                font-size: 0.875rem;
            }
        }

        .download-btn:hover {
            background-color: #1d4ed8;
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        /* الحركات (Keyframes) */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- الضباب الأزرق في الخلفية -->
    <div class="blue-fog fog-top-right"></div>
    <div class="blue-fog fog-bottom-left"></div>

    <!-- الحاوية الرئيسية -->
    <main class="glass-card">
        
        <!-- أيقونة القسم -->
        <div class="icon-box">
            <div class="icon-glow"></div>
            <i class="fa-solid fa-puzzle-piece section-icon"></i>
        </div>

        <!-- العنوان الرئيسي -->
        <h1 class="main-title">
            <span class="text-blue">الإضافات</span> 
            <span class="hub-text">والمودات</span>
        </h1>
        
        <span class="subtitle">أحدث الملفات والبرامج المتاحة للتحميل</span>

        <!-- قائمة البطاقات -->
        <div class="addons-list">
            
            <!-- البطاقة الأولى: مود ماين كرافت -->
            <div class="addon-card">
                <div class="addon-info">
                    <div class="item-icon emerald-box">
                        <i class="fa-solid fa-cube"></i>
                    </div>
                    <div>
                        <span class="item-category">لعبة ماين كرافت</span>
                        <h3 class="item-title">مود ماين كرافت</h3>
                    </div>
                </div>
                <a href="https://drive.google.com/file/d/1SV0NS7xsUXwRRc7Gd0Hz-oJ346NV-1XB/view" target="_blank" class="download-btn">
                    <i class="fa-solid fa-download"></i>
                    <span>تحميل</span>
                </a>
            </div>

            <!-- البطاقة الثانية: برنامج تنزيل فيديوهات يوتيوب -->
            <div class="addon-card">
                <div class="addon-info">
                    <div class="item-icon red-box">
                        <i class="fa-solid fa-circle-down"></i>
                    </div>
                    <div>
                        <span class="item-category">أداة تحميل</span>
                        <h3 class="item-title">برنامج يوتيوب</h3>
                    </div>
                </div>
                <a href="https://drive.google.com/file/d/1F4tcUBL5P2og6UVW8ZgMeDtsbczjY5nO/view" target="_blank" class="download-btn">
                    <i class="fa-solid fa-download"></i>
                    <span>تحميل</span>
                </a>
            </div>

        </div>
    </main>

    <!-- تضمين القائمة الجانبية المشتركة -->
    <script src="sidebar.js"></script>

</body>
</html>
