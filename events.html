<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlaaDev - الفعاليات</title>
    
    <!-- خط تجوال -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f8fc;
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1e293b;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 440px;
            padding: 40px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icon-box {
            width: 100px;
            height: 100px;
            background-color: #eff6ff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            color: #2563eb;
            font-size: 48px;
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 12px;
            color: #0f172a;
        }

        h1 span.highlight {
            color: #2563eb;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 700;
            color: #475569;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #94a3b8;
            border-radius: 50%;
        }

        p.description {
            font-size: 15px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-discord {
            width: 100%;
            background-color: #5865F2;
            color: #ffffff;
            font-weight: 700;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.25);
        }

        .btn-discord:hover {
            background-color: #4752c4;
        }

        .btn-discord:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <main class="card">
        <!-- أيقونة الفعاليات -->
        <div class="icon-box">
            <i class="fa-solid fa-calendar-days"></i>
        </div>

        <!-- العنوان الرئيسي -->
        <h1>
            <span class="highlight">الفعاليات</span> والأنشطة
        </h1>
        
        <!-- شارة الحالة -->
        <div class="status-badge">
            <span class="status-dot"></span>
            <span>لا توجد فعالية الآن</span>
        </div>

        <!-- الوصف -->
        <p class="description">
            لا توجد أي فعاليات أو مسابقات نشطة في الوقت الحالي. تابعنا دائماً لتكون أول من يعلم عند إطلاق فعاليات جديدة!
        </p>

        <!-- زر الانتقال للمجتمع -->
        <a href="community.html" class="btn-discord">
            <i class="fa-brands fa-discord"></i>
            <span>تابعنا على المجتمع</span>
        </a>
    </main>

    <!-- تضمين القائمة الجانبية المشتركة -->
    <script src="sidebar.js"></script>

</body>
</html>
